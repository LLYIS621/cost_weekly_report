<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>运营团队周报</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ── Reset ───────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:#EFF2F7;color:#1A1D23;min-height:100vh}
.wrap{max-width:1440px;margin:0 auto;padding:32px 40px}

/* ── Header ───────────────────────────────────────────── */
.rpt-header{display:flex;align-items:center;gap:16px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid #E4E8EF}
.rpt-header .logo{width:44px;height:44px;background:linear-gradient(135deg,#1A56DB,#3B82F6);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rpt-header .logo svg{width:24px;height:24px;fill:#fff}
.rpt-header h1{font-size:22px;font-weight:700;color:#1A1D23;letter-spacing:-0.3px}
.rpt-header p{font-size:13px;font-weight:300;color:#8892A6;margin-top:3px}
.rpt-header .badge{margin-left:auto;background:#EEF2FF;color:#4F46E5;font-size:12px;font-weight:600;padding:6px 16px;border-radius:20px;white-space:nowrap}

/* ── KPI Section ──────────────────────────────────────── */
// 修改大模块之间的间隙
.kpi-section{margin-bottom:32px}
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px;margin-top:60px}
.sec-hdr .dot{width:10px;height:10px;border-radius:2.5px;background:#1A56DB;flex-shrink:0}
.sec-hdr h2{font-size:15px;font-weight:700;color:#374151}
.sec-hdr span{font-size:12px;font-weight:300;color:#9CA3AF;margin-left:auto}
#trend-month-btns{display:flex;gap:6px;flex-wrap:wrap}
#trend-month-btns .mo-filter-btn{padding:4px 14px;border-radius:12px;border:1.5px solid #E5E7EB;background:#fff;color:#6B7280;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
#trend-month-btns .mo-filter-btn:hover{border-color:#1A56DB;color:#1A56DB}
#trend-month-btns .mo-filter-btn.active{background:#1A56DB;color:#fff;border-color:#1A56DB}

.kpi-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 36px 1fr 1fr 1fr;
  grid-template-rows:auto auto;gap:0 10px;
}
.tag-yr{grid-column:1/span 2;grid-row:1;align-self:end;background:#EEF2FF;color:#4338CA;margin-bottom:10px;font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;display:inline-flex;align-items:center;width:fit-content}
.tag-mo{grid-column:5/span 2;grid-row:1;align-self:end;background:#FFF7ED;color:#C2410C;margin-bottom:10px;font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;display:inline-flex;align-items:center;width:fit-content}

.yr-mo-divider{
  grid-column:4;grid-row:1/span 2;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.yr-mo-divider::before{
  content:'';position:absolute;top:9px;bottom:0;width:3px;left:50%;transform:translateX(-50%);
  background:linear-gradient(to bottom,#1A56DB,#60A5FA 45%,#FBBF24 55%,#EA580C);
}
.yr-mo-divider::after{
  content:'·';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:#fff;color:#9CA3AF;font-size:16px;line-height:1;
}

.kpi-row{grid-column:1/span 7;grid-row:2;display:contents}
.kpi-row .kpi-card:nth-child(1){grid-column:1}
.kpi-row .kpi-card:nth-child(2){grid-column:2}
.kpi-row .kpi-card:nth-child(3){grid-column:3}
.kpi-row .kpi-card:nth-child(4){grid-column:5}
.kpi-row .kpi-card:nth-child(5){grid-column:6}
.kpi-row .kpi-card:nth-child(6){grid-column:7}
.kpi-row .kpi-card{grid-row:2;align-self:stretch}
.kpi-card{
  background:#fff;border-radius:16px;padding:22px 18px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;overflow:hidden;
}
.kpi-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0;
}
.kpi-card.blue::before{background:linear-gradient(90deg,#1A56DB,#60A5FA)}
.kpi-card.orange::before{background:linear-gradient(90deg,#EA580C,#FBBF24)}
.kpi-label1{font-size:12px;font-weight:400;color:#1d4ed8;margin-bottom:10px}
.kpi-label2{font-size:12px;font-weight:400;color:#b45309;margin-bottom:10px}
.kpi-val{font-size:28px;font-weight:800;color:#1A1D23;line-height:1;margin-bottom:10px;letter-spacing:-0.5px}
.kpi-comp{font-size:11px;font-weight:400;color:#6B7280;line-height:1.7}
.kpi-comp2{color:#9CA3AF}
.pill{display:inline-block;padding:1px 5px;border-radius:8px;font-size:10px;font-weight:700;margin:0 2px}
.pill.up{background:#D1FAE5;color:#065F46}
.pill.dn{background:#FEE2E2;color:#DC2626}

/* ── 媒体汇总 ─────────────────────────────────────────── */
.media-wrap{
  background:#fff;border-radius:16px;padding:22px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:14px;overflow-x:auto;
}
.media-header{margin-bottom:14px}
.media-header h3{font-size:14px;font-weight:700;color:#374151}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}
table.tbl th{background:#F8F9FC;padding:10px 14px;text-align:center;font-weight:700;color:#6B7280;font-size:11px;border-bottom:2px solid #E5E7EB;white-space:nowrap}
table.tbl th:first-child{text-align:left}
table.tbl td{padding:10px 14px;border-bottom:1px solid #F3F4F6;color:#374151}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr:last-child td{border-bottom:none}

/* ── 当月指标达成 ─────────────────────────────────────────── */
.mt-table-wrap{margin-top:24px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.mt-table{width:100%;border-collapse:collapse;font-size:12px}
.mt-table th{background:#F8F9FC;padding:8px 12px;text-align:center;font-weight:700;color:#6B7280;font-size:12px;border-bottom:2px solid #E5E7EB;white-space:nowrap}
.mt-table th{text-align:center}
.mt-table td{padding:12px 14px;border-bottom:1px solid #F3F4F6;color:#374151;vertical-align:middle;text-align:center}
.mt-table td.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.mt-table td.dept-cell{text-align:center;font-weight:700;color:#111827;font-size:12px;min-width:80px}
.mt-table td.media-cell{text-align:left;min-width:200px}
.mt-table tr:last-child td{border-bottom:none}
.mt-bar-row{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#F3F4F6;margin-top:3px}
.mt-bar-seg{height:100%;transition:width .6s ease}
table.tbl tr:hover td{background:#FAFBFF}
table.tbl .bold{font-weight:800}
table.tbl .bar-cell{min-width:100px}
.bar-inner{height:5px;background:#EEF2FF;border-radius:3px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:3px;transition:width .8s ease}
.media-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.metric-analysis-shell{margin-top:16px;border-top:1px solid #EEF2F7;padding-top:14px}
.metric-analysis-toolbar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.metric-analysis-main-btn{border:1px solid #1A56DB;background:#1A56DB;color:#fff;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.metric-analysis-main-btn:hover{background:#174AB8;border-color:#174AB8}
.metric-analysis-range{font-size:11px;color:#6B7280;background:#F8FAFC;border:1px solid #E5E7EB;border-radius:8px;padding:5px 9px;font-weight:600}
.metric-analysis-panel{margin-top:12px;background:#FAFBFF;border:1px solid #E5E7EB;border-radius:12px;padding:14px;overflow-x:auto}
.metric-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.metric-tab{border:1px solid #D1D5DB;background:#fff;color:#4B5563;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.metric-tab:hover{border-color:#1A56DB;color:#1A56DB}
.metric-tab.active{background:#EEF2FF;border-color:#1A56DB;color:#1A56DB}
.metric-analysis-table{width:100%;border-collapse:collapse;font-size:12px;min-width:860px;background:#fff;border-radius:10px;overflow:hidden}
.metric-analysis-table th{background:#F8F9FC;padding:9px 12px;text-align:center;font-weight:700;color:#6B7280;border-bottom:2px solid #E5E7EB;white-space:nowrap}
.metric-analysis-table td{padding:10px 12px;border-bottom:1px solid #F3F4F6;color:#374151;vertical-align:middle;text-align:center}
.metric-analysis-table th:nth-child(-n+4),.metric-analysis-table td:nth-child(-n+4){width:92px;min-width:92px;max-width:92px}
.metric-analysis-table th.week-head{line-height:1.25}
.metric-analysis-table th.week-head span{display:block;font-size:10px;color:#9CA3AF;font-weight:600;margin-top:2px}
.metric-analysis-table tr:last-child td{border-bottom:none}
.metric-analysis-table td.dept-cell{font-weight:800;color:#111827;white-space:nowrap}
.metric-analysis-table td.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.metric-analysis-table td.reason-cell{text-align:center;font-weight:400;color:#1F2937;min-width:170px}
.metric-analysis-table td.detail-cell{text-align:left;color:#6B7280;line-height:1.6;min-width:260px}
.metric-delta{border-radius:7px}
.metric-delta.pos{color:#047857;background:#ECFDF5}
.metric-delta.neg{color:#DC2626;background:#FEF2F2}
.metric-delta.flat{color:#6B7280;background:#F3F4F6}
.metric-analysis-empty{font-size:12px;color:#6B7280;background:#F8FAFC;border:1px solid #E5E7EB;border-radius:10px;padding:12px;text-align:center}


/* ── 部门详情 ─────────────────────────────────────────── */
.dept-detail-section{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.dept-btn{display:inline-block;padding:6px 16px;border-radius:8px;border:1.5px solid #E5E7EB;background:#fff;color:#6B7280;font-size:12px;font-weight:600;cursor:pointer;margin-right:6px;margin-bottom:6px;transition:all .15s;font-family:inherit}
.dept-btn:hover{border-color:#1A56DB;color:#1A56DB}
.dept-btn.active{background:#1A56DB;color:#fff;border-color:#1A56DB}
.detail-charts{display:flex;gap:14px;margin-top:16px}
.detail-charts>div{flex:1;min-width:0}
.dept-staff-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:16px}
.dept-staff-table th{background:#F8F9FC;padding:8px 10px;text-align:center;font-weight:700;color:#6B7280;font-size:11px;border-bottom:2px solid #E5E7EB;white-space:nowrap;position:sticky;top:0}
.dept-staff-table td{padding:8px 10px;border-bottom:1px solid #F3F4F6;color:#374151;text-align:center;vertical-align:middle}
.dept-staff-table td.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.dept-staff-table td.name-cell{text-align:left;font-weight:600;white-space:nowrap}
.dept-staff-table td.group-cell{color:#9CA3AF;font-size:10px}
.dept-staff-table tr:last-child td{border-bottom:none}
.dept-staff-table tr:hover td{background:#FAFBFF}
.staff-table-wrap{overflow-x:auto;border:1px solid #E5E7EB;border-radius:10px}
.fail-badge{display:inline-block;background:#FEF2F2;color:#EF4444;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px}
.pass-badge{display:inline-block;background:#F0FDF4;color:#059669;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px}
.sortable-th{user-select:none;-webkit-user-select:none}.sortable-th:hover{color:#1A56DB;text-decoration:underline}

/* ── 大趋势图 ─────────────────────────────────────────── */
.trend-section{display:flex;gap:14px;align-items:stretch;margin-bottom:14px}
.trend-left{width:150px;flex-shrink:0;background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow-y:auto}
.trend-main{flex:1;min-width:0}
.trend-right{width:220px;flex-shrink:0;background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;flex-direction:column}

.media-btn{
  display:block;width:100%;padding:7px 10px;border-radius:8px;
  border:2px solid transparent;background:#F3F4F6;color:#374151;
  font-size:12px;font-weight:600;cursor:pointer;text-align:left;
  margin-bottom:6px;transition:all .2s;font-family:inherit;position:relative;
}
.media-btn:hover{border-color:#1A56DB;background:#EEF2FF}
.media-btn.active{background:#EEF2FF;color:#1A56DB;border-color:#1A56DB;font-weight:700}
.media-btn .pct{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:#9CA3AF;font-weight:400}

.trend-chart-wrap{position:relative;height:320px}
.top3-title{font-size:13px;font-weight:700;color:#374151;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #F3F4F6}
.top3-list{list-style:none;flex:1}
.top3-item{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px dashed #F3F4F6;font-size:12px;line-height:1.3}
.top3-item:last-child{border-bottom:none}
.top3-rank{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
.rank-1{background:#FFD700;color:#92400E}
.rank-2{background:#C0C0C0;color:#374151}
.rank-3{background:#CD7F32;color:#fff}
.top3-info{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top3-dept{font-weight:600;color:#374151;font-size:12px}
.top3-media{font-size:10px;color:#fff;margin-left:4px;padding:1px 5px;border-radius:4px;background:#9CA3AF}
.top3-right{text-align:right;flex-shrink:0}
.top3-cost{font-weight:700;color:#374151;font-size:12px;white-space:nowrap}
.top3-pct{color:#9CA3AF;font-weight:400;font-size:10px;display:block}

/* ── 分团队卡片 ───────────────────────────────────────── */
.team-section{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.team-card{
  background:#fff;border-radius:10px;padding:0;
  box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative;overflow:hidden;
  display:flex;flex-direction:row;
  border:1px solid #F3F4F6;
  transition:box-shadow .2s;
}
.team-card:hover {box-shadow:0 8px 24px rgba(0,0,0,.10);transform:translateY(-2px);}
.team-card .tc-left{
  flex-shrink:0;width:4px;
}
.team-card .tc-left.k2{background:linear-gradient(180deg,#667eea,#764ba2)}
.team-card .tc-left.k3{background:linear-gradient(180deg,#f59e0b,#ea580c)}
.team-card .tc-left.k4{background:linear-gradient(180deg,#10b981,#059669)}
.team-card .tc-left.k4ps{background:linear-gradient(180deg,#3b82f6,#1d4ed8)}
.team-card .tc-left.k7{background:linear-gradient(180deg,#ec4899,#db2777)}
.team-card .tc-left.xh{background:linear-gradient(180deg,#8b5cf6,#7c3aed)}
.team-card .tc-info{flex:1;min-width:0;padding:16px 16px 2px}
.team-card .tc-chart{flex:0 0 260px;min-width:0;padding:14px 8px 12px 8px}
.team-name{font-size:15px;font-weight:700;color:#374151}
.team-total{font-size:18px;font-weight:800;color:#1A1D23;letter-spacing:-0.3px;margin-top:10px}
.team-progress{width:90%;height:8px;background:#E5E7EB;border-radius:3px;overflow:hidden;margin-top:10px}
.team-progress-bar{height:100%;border-radius:3px;transition:width .6s ease}
.team-trend-label{font-size:11px;font-weight:600;color:#9CA3AF;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.team-chart{width:100%;height:60px}

@media(max-width:1100px){.team-section{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .kpi-grid{grid-template-columns:1fr 1fr 1fr 1fr}
  .yr-mo-divider{display:none}
  .tag-mo{grid-column:2}
  .trend-section{flex-direction:column}
  .trend-left,.trend-right{width:100%}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="rpt-header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M3 13h2v8H3v-8zm6-8h2v16H9V5zm6 4h2v12h-2V9zm6-6h2v18h-2V3z"/></svg>
    </div>
    <div>
      <h1>运营团队周报</h1>
      <p id="header-range"></p>
    </div>
  </div>

  <!-- KPI -->
  <div class="kpi-section">
    <div class="sec-hdr" style="margin-top:0"><div class="dot"></div><h2>数据概览</h2></div>
    <div class="kpi-grid">
      <div class="tag-yr" id="yr-days-details">年度天数</div>
      <div class="tag-mo" id="mo-days-details">月度最新</div>
      <div class="yr-mo-divider"></div>
      <div class="kpi-row">
        <div class="kpi-card blue"><div class="kpi-label1">年度消耗</div><div class="kpi-val" id="kpi-yr-total">--</div><div class="kpi-comp" id="kpi-yr-monthly-avg" style="margin-top:4px;font-size: 14px; color: #696969">月均消耗 <b>--</b></div></div>
        <div class="kpi-card blue"><div class="kpi-label1">日均消耗</div><div class="kpi-val" id="kpi-yr-daily">--</div><div class="kpi-comp" id="kpi-yr-daily-comp">--</div></div>
        <div class="kpi-card blue"><div class="kpi-label1">人均日耗</div><div class="kpi-val" id="kpi-yr-pc">--</div><div class="kpi-comp" id="kpi-yr-pc-comp">--</div></div>
        <div class="kpi-card orange"><div class="kpi-label2">月度消耗</div><div class="kpi-val" id="kpi-mo-total">--</div><div class="kpi-comp" id="kpi-mo-forecast" style="margin-top:4px">预计达成 <b>--</b></div></div>
        <div class="kpi-card orange"><div class="kpi-label2">日均消耗</div><div class="kpi-val" id="kpi-mo-daily">--</div><div class="kpi-comp" id="kpi-mo-daily-comp">--</div></div>
        <div class="kpi-card orange"><div class="kpi-label2">人均日耗</div><div class="kpi-val" id="kpi-mo-pc">--</div><div class="kpi-comp" id="kpi-mo-pc-comp">--</div></div>
	</div>
      <!-- 年度媒体消耗占比饼图 -->
      <div id="center-media-ratio" style="grid-column:1/span 3;grid-row:3;margin-top:12px;background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08)"></div>
    </div>
  </div>

  <!-- 大趋势图 -->
  <div class="sec-hdr" style="display:none"><div class="dot"></div><h2>分媒体消耗情况</h2></div>
  <div class="trend-section" style="display:none">
    <div class="trend-left" id="media-btns"></div>
    <div class="trend-main">
      <div id="trend-month-btns" style="margin-bottom:10px"></div>
      <div class="media-wrap" style="margin-bottom:0">
        <div class="trend-chart-wrap">
          <div id="mainChart" style="width:100%;height:100%;"></div>
        </div>
      </div>
    </div>
    <div class="trend-right">
      <div class="top3-title">🔥 TOP5 品牌消耗</div>
      <ul class="top3-list" id="top3List"><li style="color:#9CA3AF;text-align:center;padding:20px 0">加载中...</li></ul>
    </div>
  </div>

  <!-- 分团队卡片（动态生成） -->
  <div class="sec-hdr"><div class="dot"></div><h2>年度指标达成</h2></div>
  <div class="team-section" id="team-cards"></div>

  <!-- 人均日耗 + 年度ROI -->
  <div style="display:flex;gap:14px;margin-bottom:14px;align-items:flex-end">
    <!-- 左：人均日耗 -->
    <div class="media-wrap" style="flex:1;margin-bottom:0;padding:18px">
      <div style="font-size:12px;font-weight:600;color:#9CA3AF;margin-bottom:8px;display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#1A56DB;flex-shrink:0"></span>年人均日耗</div>
      <div id="centerPcTags" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;margin-top:30px"></div>
      <div id="deptPcChart" style="width:100%;height:250px;"></div>
    </div>
    <!-- 右：年度ROI -->
    <div class="media-wrap" style="flex:1;margin-bottom:0;padding:18px">
      <div style="font-size:12px;font-weight:600;color:#9CA3AF;margin-bottom:12px;display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#1A56DB;flex-shrink:0"></span>年预估ROI</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px"><input id="note-roi" type="text" placeholder="数据截止日期" style="border:1px solid #E5E7EB;border-radius:6px;padding:3px 10px;font-size:11px;color:#374151;width:160px;outline:none;font-family:inherit" onfocus="this.style.borderColor='#1A56DB'" onblur="this.style.borderColor='#E5E7EB'"></div>
      <div id="roiChart" style="width:100%;height:266px;"></div>
    </div>
  </div>


  <!-- 媒体汇总 -->
  <div class="sec-hdr" style="display:none"><div class="dot"></div><h2>媒体汇总</h2></div>
  <div class="media-wrap" style="display:none">
    <div class="media-header"><h3>各媒体消耗总计</h3></div>
    <table class="tbl">
      <thead><tr><th>媒体</th><th>总消耗</th><th>占比</th><th>占比条</th></tr></thead>
      <tbody id="media-tbody"></tbody>
    </table>
  </div>


  <!-- 当月指标达成 -->
  <div class="sec-hdr"><div class="dot"></div><h2>当月指标达成</h2></div>
  <div class="mt-section" id="month-target"></div>



  <!-- 周度消耗波动 -->
  <div class="sec-hdr"><div class="dot"></div><h2>周度消耗波动</h2><span id="weekly-range" style="font-size:11px;color:#9CA3AF;font-weight:400"></span></div>
  <div style="display:flex;gap:14px;margin-bottom:14px;align-items:stretch">
    <!-- 左：部门近四周日均消耗 -->
    <div class="media-wrap" style="flex:1.2;margin-bottom:0;padding:18px">
      <div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:4px">分部门近四周总消耗</div>
      <div style="font-size:10px;color:#9CA3AF;margin-bottom:12px">W1为最早，W4为当前周（可能未完整）</div>
      <div id="weekly-dept-table"></div>
    </div>
    <!-- 右：品牌环比异动 -->
    <div class="media-wrap" style="flex:1;margin-bottom:0;padding:18px">
      <div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:4px">W4 vs W3 品牌消耗异动</div>
      <div style="font-size:10px;color:#9CA3AF;margin-bottom:12px">环比变动 &gt;30% 且日均≥①元的项目，新增/停投分别标注日期</div>
      <div id="weekly-proj-alert" style="max-height:420px;overflow-y:auto"></div>
    </div>
  </div>

  <!-- 部门详情 -->
  <div class="sec-hdr"><div class="dot"></div><h2>年度分部门详情</h2></div>
  <div class="dept-detail-section" id="dept-detail">
    <div id="dept-btns"></div>
    <div id="dept-detail-content"></div>
  </div>




</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="data.js"></script>


<script src="dashboard.js"></script>
</body>
</html>
